spring.application.name=springboot-api

# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transport_simulator_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is managed by the SQL scripts in /database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Frontend integration
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

# Initial operator provisioning. No default credentials are provided.
app.operator-bootstrap.username=${OPERATOR_USERNAME:}
app.operator-bootstrap.email=${OPERATOR_EMAIL:}
app.operator-bootstrap.password=${OPERATOR_PASSWORD:}
app.operator-bootstrap.first-name=${OPERATOR_FIRST_NAME:}
app.operator-bootstrap.last-name=${OPERATOR_LAST_NAME:}

# Operator session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${OPERATOR_SESSION_TIMEOUT:30m}

# Railway operation
app.operation.zone-id=${SERVICE_TIME_ZONE:Europe/Madrid}

# Automatic device event simulation
app.device-event-simulation.enabled=${DEVICE_EVENT_SIMULATION_ENABLED:true}
app.device-event-simulation.initial-delay-ms=${DEVICE_EVENT_SIMULATION_INITIAL_DELAY_MS:1000}
app.device-event-simulation.interval-ms=${DEVICE_EVENT_SIMULATION_INTERVAL_MS:1000}

# Ticket QR signing. The private Ed25519 PKCS#8 key must only be supplied by the runtime environment.
app.ticket-qr.signing.key-id=${TICKET_QR_SIGNING_KEY_ID:}
app.ticket-qr.signing.private-key=${TICKET_QR_SIGNING_PRIVATE_KEY:}
app.ticket-qr.signing.public-key=${TICKET_QR_SIGNING_PUBLIC_KEY:}
# Semicolon-separated retired entries: key-id=base64-x509-public-key;key-id-2=base64-x509-public-key
app.ticket-qr.signing.retired-public-keys=${TICKET_QR_RETIRED_PUBLIC_KEYS:}
app.ticket-qr.signing.allowed-clock-skew-seconds=${TICKET_QR_ALLOWED_CLOCK_SKEW_SECONDS:60}
app.ticket-qr.signing.maximum-qr-length=${TICKET_QR_MAXIMUM_LENGTH:4096}

# RMM App passenger accounts
app.rmm-app.current-terms-version=${RMM_APP_CURRENT_TERMS_VERSION:2026-01}
app.rmm-app.session.access-token-lifetime=${RMM_APP_ACCESS_TOKEN_LIFETIME:30m}
app.rmm-app.session.refresh-token-lifetime=${RMM_APP_REFRESH_TOKEN_LIFETIME:30d}
app.rmm-app.account.email-verification-lifetime=${RMM_APP_EMAIL_VERIFICATION_LIFETIME:24h}
app.rmm-app.account.password-reset-lifetime=${RMM_APP_PASSWORD_RESET_LIFETIME:30m}
app.rmm-app.mail.enabled=${RMM_APP_MAIL_ENABLED:false}
app.rmm-app.mail.sender=${RMM_APP_MAIL_SENDER:noreply@rmm.local}
app.rmm-app.mail.verification-uri=${RMM_APP_EMAIL_VERIFICATION_URI:rmm://auth/verify-email?token=}
app.rmm-app.mail.password-reset-uri=${RMM_APP_PASSWORD_RESET_URI:rmm://auth/reset-password?token=}

# SMTP is only required when RMM_APP_MAIL_ENABLED=true.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
