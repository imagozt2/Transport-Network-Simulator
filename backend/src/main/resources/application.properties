spring.application.name=springboot-api

# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transport_simulator_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is managed by the SQL scripts in /database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Frontend integration
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

# Railway operation
app.operation.zone-id=${SERVICE_TIME_ZONE:Europe/Madrid}

# Automatic device event simulation
app.device-event-simulation.enabled=${DEVICE_EVENT_SIMULATION_ENABLED:true}
app.device-event-simulation.initial-delay-ms=${DEVICE_EVENT_SIMULATION_INITIAL_DELAY_MS:10000}
app.device-event-simulation.interval-ms=${DEVICE_EVENT_SIMULATION_INTERVAL_MS:60000}
app.device-event-simulation.events-per-cycle=${DEVICE_EVENTS_PER_CYCLE:5}
