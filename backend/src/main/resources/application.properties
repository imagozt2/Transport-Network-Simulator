spring.application.name=springboot-api

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/transport_simulator_db?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=REMOVED_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is managed by the SQL scripts in /database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Frontend integration
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

# Railway operation
app.operation.zone-id=${SERVICE_TIME_ZONE:Europe/Madrid}
