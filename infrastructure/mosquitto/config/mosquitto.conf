# Broker local de desarrollo. TLS y los certificados individuales se
# incorporarán antes de admitir conexiones fuera del equipo anfitrión.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/security/password_file
acl_file /mosquitto/security/acl_file

persistence true
persistence_location /mosquitto/data/
autosave_interval 30
sys_interval 1

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
