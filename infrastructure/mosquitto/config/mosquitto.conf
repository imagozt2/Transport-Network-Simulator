# Broker local de desarrollo. TLS y los certificados individuales se
# incorporarán antes de admitir conexiones fuera del equipo anfitrión.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/security/password_file
acl_file /mosquitto/security/acl_file

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 30
autosave_on_changes false
persistent_client_expiration 14d

# Evita que un cliente desconectado consuma memoria de forma ilimitada.
max_queued_messages 1000
max_queued_bytes 10485760

sys_interval 10

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
