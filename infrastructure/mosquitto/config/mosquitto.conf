# Broker local de desarrollo. La autenticación, las ACL y TLS se habilitarán
# antes de admitir conexiones que no procedan del equipo anfitrión.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30
sys_interval 1

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
