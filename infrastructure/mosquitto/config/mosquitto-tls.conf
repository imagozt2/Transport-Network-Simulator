# Listener seguro para entornos que disponen de una PKI RMM.
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false

cafile /mosquitto/security/certificates/ca.crt
certfile /mosquitto/security/certificates/broker.crt
keyfile /mosquitto/security/certificates/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# El CN del certificado se usa como identidad MQTT y debe coincidir con las
# secciones generadas en el archivo de ACL. El certificado también debe incluir
# la SAN URI definida por el contrato de identidad de las máquinas.
acl_file /mosquitto/security/acl_file

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 30
autosave_on_changes false
persistent_client_expiration 14d
max_queued_messages 1000
max_queued_bytes 10485760

sys_interval 10

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z

