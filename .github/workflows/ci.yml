name: CI

on:
  push:
    branches:
      - main
      - develop/ecosystem
  pull_request:
    branches:
      - main
      - develop/ecosystem

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build backend
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --configuration production

  android:
    name: RMM App build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test and build RMM App
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload RMM App debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rmm-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload RMM App unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmm-app-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 7

  qt:
    name: Qt applications build and tests
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6.9.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-6.9.2-msvc2022

      - name: Check out Qt MQTT 6.9.2
        uses: actions/checkout@v4
        with:
          repository: qt/qtmqtt
          ref: v6.9.2
          path: qt-mqtt-source

      - name: Set up MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install Qt MQTT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S qt-mqtt-source -B qt-mqtt-build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$env:QT_ROOT_DIR" `
            -DQT_BUILD_EXAMPLES=OFF `
            -DQT_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build qt-mqtt-build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --install qt-mqtt-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Qt applications
        shell: pwsh
        run: >-
          cmake -S qt -B qt/build-ci
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DBUILD_TESTING=ON

      - name: Build Qt applications
        run: cmake --build qt/build-ci --config Release --parallel

      - name: Test Qt applications
        run: ctest --test-dir qt/build-ci -C Release --output-on-failure

      - name: Upload Qt executables
        uses: actions/upload-artifact@v4
        with:
          name: rmm-qt-applications
          path: |
            qt/build-ci/Release/RMMTicketVendingMachine.exe
            qt/build-ci/Release/RMMTicketValidator.exe
          if-no-files-found: error
          retention-days: 7

  mqtt:
    name: MQTT integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test MQTT publication, subscription and reconnection
        shell: pwsh
        run: ./infrastructure/mosquitto/tests/mqtt-integration-tests.ps1
