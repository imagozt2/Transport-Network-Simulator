<main>
  <section class="status-card">
    <p class="eyebrow">Macegocia Metro</p>
    <h1>Transport Network Simulator</h1>
    <p>Comprobación inicial de comunicación entre las aplicaciones.</p>

    <dl>
      <div>
        <dt>Frontend</dt>
        <dd class="connected">Conectado</dd>
      </div>
      <div>
        <dt>Backend</dt>
        <dd [class]="connectionStatus()">{{ connectionStatus() }}</dd>
      </div>
      <div>
        <dt>Base de datos</dt>
        <dd [class]="databaseStatus()">{{ databaseStatus() }}</dd>
      </div>
    </dl>

    <button type="button" (click)="checkConnection()">Comprobar de nuevo</button>
  </section>
</main>

<router-outlet />
