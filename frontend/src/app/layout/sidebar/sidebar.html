<aside class="sidebar" [class.open]="open()" aria-label="Navegación principal">
  <div class="brand-block">
    <div class="brand-icon" aria-hidden="true">RMM</div>

    <div>
      <p class="brand-title">Centro de Control</p>
      <p class="brand-subtitle">Red de Metro de Macegocia</p>
    </div>
  </div>

  <nav class="sidebar-nav">
    @for (section of sections; track section.title) {
      <section class="nav-section">
        <h2>{{ section.title }}</h2>

        @for (item of section.items; track item.route) {
          @if (item.available) {
            <a
              class="nav-link"
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="navigationSelected.emit()"
            >
              <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          } @else {
            <span class="nav-link disabled" aria-disabled="true">
              <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="soon-label">Próximamente</span>
            </span>
          }
        }
      </section>
    }
  </nav>
</aside>
